# rules.yaml — the owner's settings. Copy this file to rules.yaml and edit it.
# Example: a paid coaching community on Skool (fictional).
# The agents read this file but never change it.

owner:
  name: "Alex"                       # signs the messages
  timezone: "America/Los_Angeles"
  call_time: "08:00"
  call_retries: 2
  phone: "+1-555-0100"               # placeholder
  email: "owner@example.com"         # placeholder

community:
  name: "Northstar Coaching Circle"  # fictional
  platform: skool
  mode: read_only                    # read_only: members come from an export, nothing happens inside the platform
                                     # connected: Fo reads members through an official integration the owner connected
  what_members_get: "weekly group coaching calls and accountability on personal goals"

files:
  member_sheet: "<Google Sheet link>"
  outreach_doc: "<Google Doc link>"

# Map your sheet's column names to the ones the skill expects.
# Leave a value blank if you don't have that column.
columns:
  member_id: "member_id"
  name: "Member"
  email: "email"
  channel: "channel"
  profile_link: "profile_link"
  joined: "Join date"
  last_active: "Last active date (auto, used by nightly sync)"
  posts: "posts"
  intro_posted: "intro_posted"
  posts_30d: "posts_30d"
  calls_attended_30d: "calls_attended_30d"
  goal_updated: "goal_updated"
  recent_win: "recent_win"
  recent_win_date: "recent_win_date"
  cancelled: "cancelled"
  stage: "Status"
  renewal_date: "Renewal date"
  plan_value: "plan_value"
  last_contacted: "Last contact (auto)"
  opted_out: "opted_out"
  skip: "skip"
  goal: "Current goal"
  notes: "Notes"

# Who gets picked. Rules are checked in order; a member matching any rule is a candidate.
pick:
  # Segments and their strategies live in the "Segments & strategies" tab of the sheet,
  # so the owner can edit, switch off or add to them (by hand or in brainstorm mode).
  # Priority, highest first:
  priority: [renewal_at_risk, never_started, went_quiet, fading, recent_win, goal_stalled, lurker, skipping_calls, win_back]
  max_per_segment: 2
  max_per_run: 8
  min_days_between_contacts: 14
  skip_if_notes_contain: ["Moderator"]

# How members are reached. The community platform is only read from, never messaged.
send:
  channels: ["email"]          # from the owner's own email account
  default: save_to_drafts      # asked at setup: send_now or save_to_drafts. The owner can always say otherwise on the call
  subject_style: "short, specific to the person, honest; no clickbait"

# Voice notes over email (on by default): the owner's words quoted verbatim from the call, plus
# a short note in Fo's own voice as the assistant. Played to the owner before it's sent.
voice_notes:
  enabled: true
  max_seconds: 45

tone:
  max_words: 80
  voice: "warm, direct, short; sounds like a coach checking in, not a marketer"
  must: ["mention something specific to them (goal, last call, join date)", "end with one easy question"]
  never: ["guilt", "discounts or offers", "mention that they are being tracked"]

measure:
  # Stages, lowest first. "Moved up" means a later stage in this list.
  stages: ["Red", "Yellow", "Green"]
  moved_up_window_days: 14
  attribution_days: 30
  holdout_digits: [0, 5]
  baseline_minutes: 45          # the owner's timed manual routine, per day
  revenue_target: 50000
  revenue_target_by: "2027-04-17"
